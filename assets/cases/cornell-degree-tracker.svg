<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Degree Tracker · design schematic</title><desc id="desc">Concept illustration of the documented features; no student data or credit totals shown.</desc><rect width="1200" height="520" fill="#f6f2ec"/><text x="40" y="50" font-family="Arial,sans-serif" font-size="32" fill="#302b25" font-weight="700">Degree Tracker · design schematic</text><text x="40" y="88" font-family="Arial,sans-serif" font-size="20" fill="#62574e" font-weight="400">Concept illustration of the documented features; no student data or credit totals shown.</text><rect x="40" y="125" width="360" height="340" rx="10" fill="#fffdf8" stroke="#7b6c5e" stroke-width="2"/><text x="65" y="169" font-family="Arial,sans-serif" font-size="26" fill="#302b25" font-weight="700">Degree progress</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="23" fill="#b31b1b" font-weight="700">Completed</text><text x="65" y="252" font-family="Arial,sans-serif" font-size="21" fill="#302b25" font-weight="400">Credits already earned</text><text x="65" y="307" font-family="Arial,sans-serif" font-size="23" fill="#b31b1b" font-weight="700">Planned</text><text x="65" y="339" font-family="Arial,sans-serif" font-size="21" fill="#302b25" font-weight="400">Courses in the planner</text><text x="65" y="394" font-family="Arial,sans-serif" font-size="23" fill="#b31b1b" font-weight="700">Remaining</text><text x="65" y="426" font-family="Arial,sans-serif" font-size="21" fill="#302b25" font-weight="400">Requirements still to review</text><rect x="430" y="125" width="730" height="340" rx="10" fill="#fffdf8" stroke="#7b6c5e" stroke-width="2"/><text x="458" y="169" font-family="Arial,sans-serif" font-size="26" fill="#302b25" font-weight="700">How does this course count?</text><text x="458" y="220" font-family="Arial,sans-serif" font-size="23" fill="#302b25" font-weight="700">Requirement matching</text><text x="458" y="252" font-family="Arial,sans-serif" font-size="21" fill="#302b25" font-weight="400">Explain which requirement a course could fulfill.</text><text x="458" y="307" font-family="Arial,sans-serif" font-size="23" fill="#302b25" font-weight="700">Planned vs. completed</text><text x="458" y="339" font-family="Arial,sans-serif" font-size="21" fill="#302b25" font-weight="400">Keep planned credits separate from earned credits.</text><text x="458" y="394" font-family="Arial,sans-serif" font-size="23" fill="#302b25" font-weight="700">Double-counting warning</text><text x="458" y="426" font-family="Arial,sans-serif" font-size="21" fill="#302b25" font-weight="400">Flag possible conflicts and explain what to check.</text></svg>